# House Scan: an iPhone app for scanning a house (RoomPlan). Generate the Xcode project with:
#   HOUSE_SCAN_TEAM=<your Apple team ID> xcodegen
# The .xcodeproj and Info.plist are generated, not committed; edit this file, never the plist.
# Signing uses the team in HOUSE_SCAN_TEAM (scripts/phone.sh reads it from ~/.config/house-scan/team). To build your own
# copy, also change bundleIdPrefix and the bundle IDs below to a domain you control.
name: HouseScan
options:
  bundleIdPrefix: com.danielrhody
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${HOUSE_SCAN_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HouseScan:
    type: application
    platform: iOS
    sources:
      - path: HouseScan
    info:
      path: HouseScan/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: House Scan
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: House Scan uses the camera and LiDAR to scan rooms, and to take photos of items, labels and site notes.
        NSLocationWhenInUseUsageDescription: House Scan records where a site note photo was taken and which way the phone faced, and saves it with the note.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielrhody.housescan
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  HouseScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseScanTests
    dependencies:
      - target: HouseScan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danielrhody.housescan.tests
        TARGETED_DEVICE_FAMILY: "1"
  HouseScanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseScanUITests
      - path: HouseScanTests/Fixtures.swift
    dependencies:
      - target: HouseScan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danielrhody.housescan.uitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  HouseScan:
    build:
      targets:
        HouseScan: all
        HouseScanTests: [test]
        HouseScanUITests: [test]
    test:
      targets:
        - HouseScanTests
        - HouseScanUITests
