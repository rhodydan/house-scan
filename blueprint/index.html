<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>House Blueprint</title>
  </head>
  <body>
    <main id="sheet">
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <svg id="leaders" aria-hidden="true"></svg>
    </main>

    <header class="panel">
      <h1 id="title">House</h1>
      <p class="sub">As-built survey &middot; iPhone LiDAR</p>
      <div class="row">
        <button data-view="axon" class="on">Axon</button>
        <button data-view="plan">Plan</button>
        <button data-view="side">Side</button>
        <button id="spin">Spin</button>
      </div>
      <label class="row expand">Expand <input id="expand" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
      <div class="row">
        <button id="lettering" class="on">Lettering</button>
        <button id="reset">Reset</button>
        <button id="edit-site" hidden>Edit site</button>
      </div>
    </header>

    <nav id="rail" aria-label="Floors"></nav>

    <aside class="titleblock" aria-label="Title block">
      <div><small>Sheet</small><b>A-1</b></div>
      <div><small>Scale</small><b>As shown</b></div>
      <div><small>Date</small><b id="sheet-date"></b></div>
      <div class="wide north-cell">
        <svg id="north" viewBox="0 0 40 40" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.2" hidden>
          <circle cx="20" cy="22" r="12" />
          <path d="M20 12 L25 31 L20 27 L15 31 Z" fill="currentColor" />
          <text x="20" y="8" text-anchor="middle" fill="currentColor" stroke="none" font-size="9">N</text>
        </svg>
        <div><small>North</small><b id="north-note">Not set</b></div>
      </div>
      <div class="wide"><small>Note</small><b>LiDAR survey, approximate. Measure anything critical by hand.</b></div>
    </aside>

    <section id="drop" hidden>
      <p>Drop the house folder's files here: house.json and each floor's JSON.</p>
      <input type="file" multiple accept=".json" />
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
